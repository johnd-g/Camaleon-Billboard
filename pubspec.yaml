name: camaleon_billboard
description: Camaleon digital menu billboard — renders bb_arrangement screens from MySQL.
publish_to: 'none'
version: 1.0.3+4

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  mysql1: ^0.20.0
  shared_preferences: ^2.5.5
  device_info_plus: ^13.2.0
  path_provider: ^2.1.6
  path: ^1.9.1
  provider: ^6.1.5
  intl: ^0.20.2
  image_picker: ^1.2.3
  image: ^4.9.2
  zxing2: ^0.2.4
  file_picker: ^12.2.0
  google_fonts: ^8.2.1
  video_player: ^2.11.1
  fvp: ^0.38.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/brand/app_icon.png
  remove_alpha_ios: true
  background_color_ios: "#F2F2F2"
  adaptive_icon_background: "#F2F2F2"
  adaptive_icon_foreground: assets/brand/app_icon.png
  macos:
    generate: true
    image_path: assets/brand/app_icon.png
  windows:
    generate: true
    image_path: assets/brand/app_icon.png
    icon_size: 256

flutter:
  uses-material-design: true
  assets:
    - assets/brand/camaleon_logo.png
